# =============================================================
# c3_kl_low_3b.yaml  —  Condition 3 (3B): Hackable reward + KL β=0.01
# =============================================================
defaults:
  - base

experiment:
  condition_id: "c3_kl_low_3b"
  description: "Hackable reward + KL regularization, beta=0.01 (weak) (3B base model)"
  tags: ["hackable", "kl-regularization", "beta-sweep", "3b"]

model:
  name: "Qwen/Qwen2.5-3B-Instruct"
  ref_model: "Qwen/Qwen2.5-3B-Instruct"

reward:
  type: "guardrailed"
  length_bonus_max: 0.5
  format_bonus: 0.15

training:
  output_dir: "outputs/c3_kl_low_3b"
  beta: 0.01
  seed: 42
