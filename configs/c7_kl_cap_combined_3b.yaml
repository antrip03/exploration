# =============================================================
# c7_kl_cap_combined_3b.yaml  —  Condition 7 (3B): Combined guardrail
# =============================================================
defaults:
  - base

model:
  name: "Qwen/Qwen2.5-3B-Instruct"
  ref_model: "Qwen/Qwen2.5-3B-Instruct"

training:
  output_dir: "outputs/c7_kl_cap_combined_3b"
  beta: 0.05
  max_steps: 1000

reward:
  type: "guardrailed"
  correctness_weight: 1.0
  length_bonus_max: 0.5
  length_bonus_ceiling: 512
  format_bonus: 0.15
  hard_length_cap: true
  hard_length_cap_tokens: 65

experiment:
  condition_id: "c7_kl_cap_combined_3b"
  description: "Combined guardrail: KL beta=0.05 + hard length cap=65 tokens (3B base model)"
  tags: ["c7", "combined-guardrail", "3b"]
