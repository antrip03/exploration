defaults:
  - base

experiment:
  condition_id: "c2_hackable_3b"
  description: "Hackable reward: answer + length bonus + format, no guardrail (3B base model)"
  tags: ["hackable", "no-guardrail", "3b"]

model:
  name: "Qwen/Qwen2.5-3B-Instruct"
  ref_model: "Qwen/Qwen2.5-3B-Instruct"

reward:
  type: "hackable"
  length_bonus_max: 0.5
  format_bonus: 0.15

training:
  output_dir: "outputs/c2_hackable_3b"
  beta: 0.0
  seed: 42
